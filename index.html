<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <meta name="description" content="Close Enough Construction job, estimate, schedule, payment and crew communication app." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Close Enough Construction</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">Close Enough Construction</div>
        <div class="tagline">Projects. Estimates. Scheduling. Crew.</div>
      </div>
      <div class="top-actions"><button onclick="setRoute('account')" class="ghost-btn">Account</button><button id="installBtn" class="ghost-btn hidden">Install App</button></div>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button data-route="home" class="nav-btn active">Home</button>
      <button data-route="jobs" class="nav-btn">Jobs</button>
      <button data-route="new" class="nav-btn primary-nav">+ Job</button>
      <button data-route="chat" class="nav-btn">Chat</button>
      <button data-route="schedule" class="nav-btn">Schedule</button>
    </nav>
  </div>

  <template id="jobCardTemplate">
    <article class="job-card">
      <div class="job-card-head">
        <div>
          <h3 class="job-name"></h3>
          <p class="job-type muted"></p>
        </div>
        <span class="status-pill"></span>
      </div>
      <p class="job-address"></p>
      <div class="money-row">
        <span>Estimate <strong class="job-estimate"></strong></span>
        <span>Paid <strong class="job-paid"></strong></span>
        <span>Balance <strong class="job-balance"></strong></span>
      </div>
      <button class="open-job-btn">Open Job</button>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
